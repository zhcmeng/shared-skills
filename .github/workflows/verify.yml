# 推送后自动跑仓库里的检查。
# 用 windows-latest 而不是 Linux：50 那块要 Windows PowerShell（powershell.exe），
# 10 和 40 还要走 cmd.exe 批处理分支；换 Linux 会把这几项静默跳过，
# 而这几项正是「坏了不报错」的那类。node、python、Git Bash 那台机器都自带。
# 不用 --changed：CI 的浅克隆没有可比的基线，跑全量才可靠。
name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Windows 控制台上 python 默认按本机编码输出，中文会变成替换字符；
  # tests/run.sh 自己也带 -X utf8，这里统一兜住技能脚本的输出。
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pdf-to-md 的技能脚本在顶层 import requests、lxml、tabulate，测试会连带导入它们；
      # token-counter 的 tokenizers 由脚本自己从 wheels/ 装，不在这里列。
      - name: 安装测试依赖
        shell: bash
        run: python -m pip install --disable-pip-version-check requests lxml tabulate

      - name: 跑 checks/verify.sh（全部模块）
        shell: bash
        run: bash checks/verify.sh

      - name: 跑技能脚本测试
        shell: bash
        run: bash tests/run.sh
