# TP-5；TC-21 counting_request_main_scenario；覆盖项 TCOV-33；风险等级 高。
# 这一条兑现的模型：TM-4。
# 判据落在「要读执行过程」那一层——要判出它有没有真把计数脚本调起来。

id: tp05-01-TC-21-counting_request_main_scenario
title: 数一次文本的主场景
description: 用户给一段文本要数 token，技能把计数脚本调起来，报回的数是脚本那一个。

input:
  # 兑现 ENV-1、ENV-2、ENV-3、ENV-4、ENV-8、ENV-9；DATA-1 第 1 段原样接在请求后面。
  prompt: |-
    帮我数一下这段话的 token：DeepSeek tokenizer counts exactly.

judge:
  type: agent_judge
  criteria:
    # 判据逐条兑现 TC-21「预期结果」那一栏。
    - "答话里报出 tokens: 8"
    - "执行过程里技能真把计数脚本调起来跑了一遍，交给它的是那段原样的文本（没改写、没截断）"
    - "没有绕开脚本另找一个数顶上"
  pass_threshold: 1.0
