# TP-5；TC-24 tokens_only_request；覆盖项 TCOV-16、TCOV-38；风险等级 高。
# 这一条兑现的模型：TM-4。

id: tp05-04-TC-24-tokens_only_request
title: 只要 token 量时把 token 数报回
description: 用户只问 token 量，技能把 token 数报回去。

input:
  # 兑现 ENV-1、ENV-2、ENV-3、ENV-4、ENV-8、ENV-9；DATA-1 第 1 段原样接在请求后面。
  prompt: |-
    这段话有多少 token？DeepSeek tokenizer counts exactly.

judge:
  type: agent_judge
  criteria:
    # 判据逐条兑现 TC-24「预期结果」那一栏。
    # 顺带报了字符数不算没做到——依据那句「报告 N 即可」是允许，不是只许报 N。
    - "答话里给出 8 这个 token 数"
  pass_threshold: 1.0
