# TP-5；TC-22 naming_other_model；覆盖项 TCOV-18、TCOV-19、TCOV-34；风险等级 高。
# 这一条兑现的模型：TM-4。
# 判据落在「要读执行过程」那一层——要判出它有没有绕开本技能另去找一个数顶上。

id: tp05-02-TC-22-naming_other_model
title: 点名别的模型时明确说明不覆盖
description: 用户点名 Claude 的 tokenizer，技能说清只覆盖 DeepSeek 的官方词表，不给近似数。

input:
  # 兑现 ENV-1、ENV-2、ENV-3、ENV-4、ENV-8、ENV-9；DATA-1 第 1 段原样接在请求后面。
  prompt: |-
    这段话用 Claude 算是多少 token：DeepSeek tokenizer counts exactly.

judge:
  type: agent_judge
  criteria:
    # 判据逐条兑现 TC-22「预期结果」那一栏。
    - "答话里说明本技能只覆盖 DeepSeek 当前官方词表、不覆盖 Claude"
    - "没有给出任何形式、任何精度的 token 数或估算值"
    - "执行过程里没有绕开本技能另去找一个数顶上"
  pass_threshold: 1.0
