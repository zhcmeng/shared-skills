# TP-6；TC-25 full_dialogue_assembled_first；覆盖项 TCOV-20、TCOV-36；风险等级 高。
# 这一条兑现的模型：TM-4。
# 判据落在「要读执行过程」那一层——要判出它有没有把裸文本的数当成整次请求的数报出去。

id: tp06-01-TC-25-full_dialogue_assembled_first
title: 估一次完整对话请求时先按对话模板拼装再计数
description: 用户要把一段文本当成一次完整请求来估，技能先拼装再计数，不拿裸文本的数顶上。

input:
  # 兑现 ENV-1、ENV-2、ENV-3、ENV-4、ENV-8、ENV-9；DATA-11 那段原文原样接在请求后面。
  prompt: |-
    把下面这段用户消息当成一次完整的对话请求来估，一共多少 token：请用一句话说明 DeepSeek 的 tokenizer 是离线可用的。

judge:
  type: agent_judge
  criteria:
    # 判据逐条兑现 TC-25「预期结果」那一栏。
    - "执行过程里没有把那段正文原样交给脚本数完就当成整次请求的用量"
    - "它先按对话模板把这一段拼装起来（补上角色标记与特殊 token 那一层）再交给脚本数"
    - "答话里报的是拼装后那一份的数"
  pass_threshold: 1.0
