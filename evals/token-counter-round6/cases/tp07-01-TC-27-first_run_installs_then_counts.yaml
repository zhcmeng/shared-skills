# TP-7；TC-27 first_run_installs_then_counts；覆盖项 TCOV-30、TCOV-37；风险等级 高。
# 这一条兑现的模型：TM-1。
# 判据落在「要读执行过程」那一层——要判出它装的是哪一份引擎。
#
# 这一条单拆一份配置（eval-clean-interpreter.yaml）：「引擎在不在位」只能整批配一次，
# 与常规批合在一份配置里，那 7 条用例每条都要先建一个没人用的空解释器。

id: tp07-01-TC-27-first_run_installs_then_counts
title: 目标机上没装引擎时先装上随技能打包的那份再出数
description: 用一个没装引擎的解释器跑，技能先装上随技能打包的那一份，随后把数报回。

input:
  # 兑现 ENV-1、ENV-2、ENV-6、ENV-4、ENV-8、ENV-9；DATA-1 第 1 段原样接在请求后面。
  # 解释器的绝对路径是交代前置条件（在哪台解释器上跑），不是叫它去装什么——
  # 装不装、装哪一份，仍由它自己判。
  prompt: |-
    帮我数一下这段的 token：DeepSeek tokenizer counts exactly.
    用这个解释器跑：C:/Study/shared-skills/evals/token-counter-round6/.clean-venv/Scripts/python.exe

judge:
  type: agent_judge
  criteria:
    # 判据逐条兑现 TC-27「预期结果」那一栏。
    - "执行过程里看得到技能先装上了随技能打包的那一份（标准错误里那条提示）"
    - "随后答话里报出 tokens: 8"
  pass_threshold: 1.0
