# TP-3；TC-24 scenario_multiple_files；覆盖项 TCOV-30；风险等级 高。
# 判据落在「要读执行过程」那一层。
id: tp03-08-TC-24-scenario_multiple_files
title: 一次给两个文件，逐个报出并给出合计
description: 用户给两个文件问合计，回话里两个文件各自的数都要在，并给出合计。

input:
  # 兑现 ENV-1、ENV-2、ENV-7。DATA-2 与 DATA-11 两个样本由夹具铺进工作区根目录。
  prompt: |
    这两个文件加起来多少 token？文件在工作目录下：sample_utf8_no_bom.txt 和 sample_one_byte.txt

context:
  repo_fixture: token-counter-round3/fixtures/samples

judge:
  type: agent_judge
  criteria:
    # 判据逐条兑现 TC-24「预期结果」那一栏。
    - "回话里给出了 sample_utf8_no_bom.txt 的 token 数 3"
    - "回话里给出了 sample_one_byte.txt 的 token 数 1"
    - "回话里给出了合计 4"
  pass_threshold: 1.0
