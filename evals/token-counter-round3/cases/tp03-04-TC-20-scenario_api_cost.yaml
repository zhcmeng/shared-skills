# TP-3；TC-20 scenario_api_cost；覆盖项 TCOV-26；风险等级 高。
# 判据落在「要读执行过程」那一层。
id: tp03-04-TC-20-scenario_api_cost
title: 估算调用成本时给出数，并说明缓存命中那部分算不出来
description: 用户问这段文本调一次 API 大概多少钱，回话里要给数，并说明离线算不出缓存命中。

input:
  # 兑现 ENV-1、ENV-2、ENV-7。DATA-1 的正文照通用稿抄。
  prompt: |
    这段文本调一次 API 大概多少钱？文本是：你好，世界

judge:
  type: agent_judge
  criteria:
    # 判据逐条兑现 TC-20「预期结果」那一栏。
    - "回话里给出这次调用的 token 数 3"
    - "回话里说明离线算不出缓存命中的那部分"
    - "transcript 里能读到它跑过一次 count_tokens.py"
  pass_threshold: 1.0
