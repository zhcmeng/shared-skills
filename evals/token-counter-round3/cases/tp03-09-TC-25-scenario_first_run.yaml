# TP-3；TC-25 scenario_first_run；覆盖项 TCOV-31；风险等级 高。
# 判据落在「要读执行过程」那一层。
id: tp03-09-TC-25-scenario_first_run
title: 引擎还没装的机器上，技能自行装好，不要求用户额外动手
description: 指定一个还没装引擎的干净解释器，回话里要报出数，且引擎是脚本自己装好的。

input:
  # 兑现 ENV-1、ENV-2、ENV-5、ENV-7。
  # ENV-5 那个干净解释器由批次配置的 environment.setup_steps 现建，路径写死在那儿；
  # 这里把同一个路径原样给被测那边。
  # DATA-1 的正文照通用稿抄。
  prompt: |
    帮我算一下「你好，世界」这句话有多少 token。用这个解释器跑：C:/Study/shared-skills/evals/token-counter-round3/.clean-venv/Scripts/python.exe

judge:
  type: agent_judge
  criteria:
    # 判据逐条兑现 TC-25「预期结果」那一栏。
    - "回话里报出了 token 数 3"
    - "transcript 里能读到它跑过一次 count_tokens.py"
    - "引擎是脚本自己装好的——执行过程里能读到装引擎那一步，或者跑完之后那个解释器里有了它"
    - "回话里没有要求用户先去装引擎，也没有因为缺引擎就改口说算不了"
  pass_threshold: 1.0
