# TP-3；TC-17 scenario_main_count；覆盖项 TCOV-23；风险等级 高。
# 判据落在「要读执行过程」那一层——除了回话里那个数，还要看它是不是真去跑了脚本。
id: tp03-01-TC-17-scenario_main_count
title: 问一段文本的 token 数，真去跑脚本并把数报出来
description: 主场景。用户给出一段文本问 token 数，回话里要给出这个数，且这个数是跑脚本跑出来的。

input:
  # 兑现 ENV-1、ENV-2、ENV-7（都在批次配置的 environment 与 judge 那两条上）。
  # DATA-1：这一段正文照通用稿「测试数据需求」里那段抄，一个字不改。
  prompt: |
    帮我算一下「你好，世界」这句话有多少 token

judge:
  type: agent_judge
  criteria:
    # 判据逐条兑现 TC-17「预期结果」那一栏。
    - "回话里报出了 token 数 3"
    - "transcript 里能读到它跑过一次 count_tokens.py"
    - "跑的那一次给的正是「你好，世界」这一段文本——不是凭印象报的数"
  pass_threshold: 1.0
