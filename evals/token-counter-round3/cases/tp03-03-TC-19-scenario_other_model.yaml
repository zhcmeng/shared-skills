# TP-3；TC-19 scenario_other_model；覆盖项 TCOV-25；风险等级 高。
# 判据落在「要读执行过程」那一层。
id: tp03-03-TC-19-scenario_other_model
title: 点名别的模型时说明覆盖不了，不拿别的数顶替
description: 用户点名 Claude，回话里要说明本技能只覆盖 DeepSeek 的官方词表，不给当作答案的近似数。

input:
  # 兑现 ENV-1、ENV-2、ENV-7。
  prompt: |
    帮我算一下「你好，世界」在 Claude 上是多少 token

judge:
  type: agent_judge
  criteria:
    # 判据逐条兑现 TC-19「预期结果」那一栏。
    - "回话里说明本技能只覆盖 DeepSeek 的官方词表、覆盖不了 Claude"
    - "没有给出一个当作答案的近似数"
    - "没有拿 DeepSeek 那边算出来的数顶替 Claude 的数"
  pass_threshold: 1.0
