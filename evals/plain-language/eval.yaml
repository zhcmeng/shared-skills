# 运行一：装技能，跑 TP-1 至 TP-7（TC-1 至 TC-7）。
# 相对路径的基准是 evals/：skill-up 从 eval.yaml 所在目录往上找带 SKILL.md 的目录，找不到就退到
# 「eval.yaml 所在目录的上一层」。这份配置就在 evals/plain-language/ 下，所以基准是 evals/，
# 下面每一条相对路径都带 plain-language/ 这个前缀。改这一份之前先看实施方案 2.1 第 2 小节。
# ENV-5 的注入由下面 setup_steps 那条命令做：从绝对路径读真仓库那份 rules.md，写进工作区的
# CLAUDE.md。那条路径写死在本机，换机器要改。见实施方案 2.1 第 4 小节第 4 条。
#
# 模型（TM）：这一批七条用例由四个测试模型导出——TM-1（一段文字里各类片段怎么处理）、TM-2（逐处怎么处置）、
# TM-3（整档的产出与交代）、TM-4（整条链）。哪个模型导出哪些覆盖项，见测试用例规格说明的「测试覆盖项」表；
# 运行二那条 TC-8 只用到 TM-4。
#
# 环境项（ENV）落在哪儿：
#   ENV-1：下面 skills 那一段——整套技能按「使用者机器上装好的技能」交给 agent。
#   ENV-2：下面 report 那一段，加上各条用例的 judge.context——取当轮的回复、执行的命令、盘上改动的前后差别。
#   ENV-3：各条用例的 judge 那段上方。
#   ENV-4：每条用例各有一块可写工作区，用到的样本按 DATA-… 铺进去，各条用各的，原始样本在夹具里全程不动。
#   ENV-5：上面那条 setup_steps 命令。
#   ENV-6：每条用例各起一个能重来、能隔离的工作目录——框架新建，跑完就删，一条一条重来。
#   ENV-7：被测那侧的执行环境就是跑 skill-up 的这台机器（environment.type: none）；样本副本也在这一处。
schema_version: v1alpha1

environment:
  type: none
  setup_steps:
    - run: cat "C:/Study/shared-skills/plugin/skills/plain-language/rules.md" >> CLAUDE.md

mcp:
  servers: []

skills:
  - source: local_path
    path: ../plugin/skills/plain-language
    include:
      - SKILL.md
      - rules.md

engine:
  name: claude_code

cases:
  files:
    - plain-language/cases/tp01-01-TC-1-fix_only_what_should_change.yaml
    - plain-language/cases/tp02-01-TC-2-quotes_kept_and_glossed.yaml
    - plain-language/cases/tp03-01-TC-3-scope_of_review.yaml
    - plain-language/cases/tp04-01-TC-6-file_nothing_to_fix.yaml
    - plain-language/cases/tp05-01-TC-7-file_blocked_reports_where.yaml
    - plain-language/cases/tp06-01-TC-4-restate_whole_answer.yaml
    - plain-language/cases/tp07-01-TC-5-restate_nothing_to_fix.yaml
  defaults:
    timeout_seconds: 600
    max_turns: 12
    expect:
      exit_code: 0
  parallelism: 1
  retry_policy:
    max_retries: 0

benchmark:
  enabled: false

report:
  formats: [json, html]
  artifacts: [transcript]
