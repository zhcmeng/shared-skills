# 运行二：不装技能，只跑 TP-8（TC-8）。
# 这一档判的是「rules.md 注进上下文之后，落笔时按不按它写」；技能会不会被唤起不在这批用例里判。
# 相对路径的基准是 evals/，见 eval.yaml 开头那段说明。
# ENV-5 的注入由下面 setup_steps 那条命令做，与运行一同一条道；见 2.1 第 4 小节第 4 条。
schema_version: v1alpha1

environment:
  type: none
  setup_steps:
    - run: cat "C:/Study/shared-skills/plugin/skills/plain-language/rules.md" >> CLAUDE.md

mcp:
  servers: []

engine:
  name: claude_code

cases:
  files:
    - plain-language/cases/tp08-01-TC-8-ambient_writing_stays_plain.yaml
  defaults:
    timeout_seconds: 600
    max_turns: 12
    expect:
      exit_code: 0
  parallelism: 1
  retry_policy:
    max_retries: 0

benchmark:
  enabled: false

report:
  formats: [json, html]
  artifacts: [transcript]
