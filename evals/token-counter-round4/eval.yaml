schema_version: v1alpha1

# 这一份落的是常规批：TP-1、TP-2、TP-3 三条规程，共 15 条用例。
# TC-16（TP-4）不在这里——它要一个没装引擎的解释器，落在 eval-clean-interpreter.yaml。
# 两批各跑各的，落进 runs/ 下各自的时间戳目录。
#
# 用例文件名照 issue_ids.py --case-dirs 打出来的写，加 .yaml。
# 执行位次就在文件名里（tp01-01 那一段），字母序等于执行顺序，不另外排。
#
# 覆盖项 TCOV-16（平台不符时改走联网安装那条道）判为不可行，已从分母里剔除，
# 这一批与干净解释器批都不落它：它要一台平台不是 64 位 Windows、或者 CPython 低于 3.9 的
# 机器，手上只有本机这一种平台，造不出来。这一条的落点写在测试用例规格说明的对应表里
# （那一格写「不可行，未导出用例」），这里不重复。

# ENV-1、ENV-2：测试规程在哪跑、被测那侧在哪执行——两条指的是同一台机器，
# 都由这一条兑现：命令在宿主机上跑，不起容器。
environment:
  type: none
  # ENV-6：开跑前确认宿主机那个解释器里引擎在位。这一步是整份配置级的，
  # 15 条用例每条开跑前都走一遍——一次 import 的事，不值当为它拆配置。
  # 引擎不在位时它退非零，整条用例当场报错，免得十几条一个个报出看不懂的失败。
  setup_steps:
    - run: python -c "import tokenizers"

# ENV-4：被测技能整个目录装进工作区的 .claude/skills/token-counter/，
# 随技能分发的 tokenizer.json 与 wheels/ 跟着一起进去。
# 相对路径的基准是这一份配置的上一层（evals/）——技能与评测材料不在一棵树里，
# 跑起来会打一条 SKILL.md not found ... falling back to 的警告，那是正常产物，不是错。
skills:
  - source: local_path
    path: ../plugin/skills/token-counter

engine:
  name: claude_code

cases:
  files:
    - token-counter-round4/cases/tp01-01-TC-1-text_ascii_tokens_only.yaml
    - token-counter-round4/cases/tp01-02-TC-2-text_chinese_both_counts.yaml
    - token-counter-round4/cases/tp01-03-TC-3-text_mixed_with_spaces.yaml
    - token-counter-round4/cases/tp01-04-TC-4-file_markdown_path.yaml
    - token-counter-round4/cases/tp01-05-TC-5-stdin_route.yaml
    - token-counter-round4/cases/tp01-06-TC-6-empty_text.yaml
    - token-counter-round4/cases/tp01-07-TC-7-special_token_literal.yaml
    - token-counter-round4/cases/tp02-01-TC-8-text_for_full_dialogue.yaml
    - token-counter-round4/cases/tp02-02-TC-9-naming_other_model.yaml
    - token-counter-round4/cases/tp02-03-TC-10-asks_api_cost.yaml
    - token-counter-round4/cases/tp02-04-TC-11-asks_cost_and_chars.yaml
    - token-counter-round4/cases/tp03-01-TC-12-no_route_given.yaml
    - token-counter-round4/cases/tp03-02-TC-13-file_missing.yaml
    - token-counter-round4/cases/tp03-03-TC-14-path_is_directory.yaml
    - token-counter-round4/cases/tp03-04-TC-15-file_not_utf8.yaml
  # 这一批可以并发：15 条用例各起一个工作区，夹具各铺各的；
  # 共用的只有宿主机上那台已经装好引擎的解释器，而这一批里没有一条用例会去动它——
  # 都是读它、调它，不装也不卸。判据落在各条用例自己的回话与执行过程上，互相看不到对方。
  parallelism: 4
  defaults:
    # 机械层只卡这一条。这一批的判据没有一条落在某个固定的字串或盘上文件上，卡不住，
    # 全交给判官。
    expect:
      exit_code: 0
    # 判官那一轮要读 transcript，偶尔第一次吐不出能解析的 JSON、重试一次才成；
    # 默认 300 秒不够它重试完时，那一条会报 ERROR——那不是被测那边没过，是判官被
    # 时间卡住了（第 2 遍 TC-15 就是这么来的）。抬到 600 秒，给重试留出余量。
    timeout_seconds: 600

judge:
  type: agent_judge
  # 判官自己也要跑一轮模型。走的是本机那个网关，模型名用 Anthropic 那一套。
  model: anthropic/claude-sonnet-5
  # context 用默认的 standard：final_message 内联，transcript 与 workspace_diff
  # 以文件引用给出。判据落在「要读执行过程」那一层的八条（TC-1、TC-4、TC-5、
  # TC-12、TC-13、TC-14、TC-15），要判「有没有真去跑脚本、走的是哪条道」，
  # 得读 transcript 才判得了。
  # 用例那一层只写 criteria 与 pass_threshold，判官类型与模型在这里继承。

report:
  # result.json 一直会写，那一项不用列。把 html 列上，跑完直接出一份能点开看的报告。
  formats: [json, html]
