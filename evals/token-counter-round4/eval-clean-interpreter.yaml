schema_version: v1alpha1

# 这一份落的是干净解释器批：只有 TP-4 一条规程、TC-16 一条用例。
# 它跑在一个没装引擎的解释器上；「装不装引擎」只能整批配一次，配在 environment 那一层，
# 一批里每条用例开跑前都会走一遍——所以这一条与常规批合不进同一份配置，
# 与 TP-1、TP-2、TP-3 分两次跑。
#
# 用例文件名照 issue_ids.py --case-dirs 打出来的写，加 .yaml。

# ENV-1、ENV-2：与常规批同一台机器、同一个跑法。
environment:
  type: none
  # ENV-3、ENV-5、DATA-7：会话起来之前现建一个空解释器，里面一样包都没有。
  # 这一步是整份配置级的；这一批只装了一条用例，批次级正好等于用例级。
  # --clear 是为了重跑：上一回跑完引擎已经装在里面了，不清掉的话这一条就白跑了。
  # DATA-7 的复位动作是跑完把这个目录整个删掉，不逐个卸包。
  # 路径写死成绝对路径：建它的时候工作区还是个空目录，相对路径没有可作基准的东西；
  # tc04-01 那条用例的消息里把这个路径原样给被测那边。
  setup_steps:
    - run: python -m venv --clear "C:/Study/shared-skills/evals/token-counter-round4/.clean-venv"

# ENV-4：与常规批同一处——被测技能整个目录装进工作区，
# 随技能分发的 tokenizer.json 与 wheels/ 跟着一起进去，首次运行装的就是 wheels/ 里那一份。
skills:
  - source: local_path
    path: ../plugin/skills/token-counter

engine:
  name: claude_code

cases:
  files:
    - token-counter-round4/cases/tp04-01-TC-16-first_run_installs_bundled_engine.yaml
  # 这一批只有一条用例，没有并发这回事。
  parallelism: 1
  defaults:
    # 机械层只卡这一条；判据全交给判官。
    expect:
      exit_code: 0
    # 同常规批：判官那一轮偶尔要重试一次，300 秒不够时会报 ERROR——那是判官被时间
    # 卡住，不是被测那边没过。抬到 600 秒。
    timeout_seconds: 600

judge:
  type: agent_judge
  model: anthropic/claude-sonnet-5
  # context 用默认的 standard。这一条的判据落在「要读执行过程」那一层：
  # 要判出装引擎那一步走的是随技能打包的那一份、没有联网去取，得读 transcript。

report:
  # result.json 一直会写，那一项不用列。把 html 列上，跑完直接出一份能点开看的报告。
  formats: [json, html]
