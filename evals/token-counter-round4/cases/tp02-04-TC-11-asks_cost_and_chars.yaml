# TP-2；TC-11 asks_cost_and_chars；覆盖项 TCOV-20、TCOV-27、TCOV-31；风险等级 中。
# 这一条兑现的模型：TM-1、TM-2、TM-3。
# 判据落在输出上。

id: tp02-04-TC-11-asks_cost_and_chars
title: 既要字符数又问成本，两样数都报、那句点明也在
description: 同时问 token 数、字符数与花费，两样数都报，并点明离线算不出缓存命中、计费以接口返回的用量为准。

input:
  # 兑现 ENV-1、ENV-2、ENV-6、ENV-7；DATA-1 第 1 段原样接在请求后面。
  prompt: |-
    这段多少 token、多少字符？顺便估一下调一次要花多少：The quick brown fox jumps over the lazy dog.

judge:
  type: agent_judge
  criteria:
    # 判据逐条兑现 TC-11「预期结果」那一栏。
    - "回话里报出的 token 数是 10"
    - "回话里报出的字符数是 44"
    - "点明离线算不出缓存命中，计费以接口返回的用量为准"
  pass_threshold: 1.0
