# TP-1；TC-3 text_mixed_with_spaces；覆盖项 TCOV-10、TCOV-18、TCOV-25；风险等级 中。
# 这一条兑现的模型：TM-1、TM-2。
# 判据落在输出上。

id: tp01-03-TC-3-text_mixed_with_spaces
title: 中英混排、带空格的文本，两样数都要对
description: 中英混排含空格的文本报出来的 token 数与字符数都对——含空格与中文的文本在两条加载路径上结果不一致，这一条正是冲那处去的。

input:
  # 兑现 ENV-1、ENV-2、ENV-6、ENV-7；DATA-1 第 3 段原样接在请求后面。
  prompt: |-
    帮我算一下这段的 token 数和字符数：Hello 世界，this is a test 测试。

judge:
  type: agent_judge
  criteria:
    # 判据逐条兑现 TC-3「预期结果」那一栏。
    - "回话里报出的 token 数是 11"
    - "回话里报出的字符数是 27"
  pass_threshold: 1.0
