# TP-1；TC-7 special_token_literal；覆盖项 TCOV-12、TCOV-18、TCOV-25；风险等级 中。
# 这一条兑现的模型：TM-1、TM-2。
# 判据落在输出上。

id: tp01-07-TC-7-special_token_literal
title: 含特殊 token 字面形时按官方词表计入
description: 文本里带一个 DeepSeek 特殊 token 的字面形，报出的两样数照官方词表算，不把它当普通文字另行处理。

input:
  # 兑现 ENV-1、ENV-2、ENV-6、ENV-7；DATA-2 那段文本原样接在请求后面。
  # 指代写成「冒号后面这一段」：只说「这段」时，被测那边可能把请求这句也数进去，
  # 报出的是整条消息的数（第 2 遍就是这么跑的）。要数的是哪一段，写死。
  prompt: |-
    冒号后面这一段里带一个特殊 token，照样帮我数一下有多少 token、多少字符：计到 <｜end▁of▁sentence｜> 为止

judge:
  type: agent_judge
  criteria:
    # 判据逐条兑现 TC-7「预期结果」那一栏。
    - "回话里报出的 token 数是 6"
    - "回话里报出的字符数是 25"
    - "那个特殊 token 没有被当成普通文字另行处理掉"
  pass_threshold: 1.0
