# TP-1；TC-6 empty_text；覆盖项 TCOV-11、TCOV-18、TCOV-25；风险等级 高。
# 这一条兑现的模型：TM-1、TM-2。
# 判据落在输出上。

id: tp01-06-TC-6-empty_text
title: 空文本报 0，不报错也不跳过
description: 交过去一段 0 个字符的文本，报回的 token 数与字符数都是 0，不报错、不跳过不答。

input:
  # 兑现 ENV-1、ENV-2、ENV-6、ENV-7。
  # DATA-1 第 4 段正文什么都不写，这里写成显式的空串——不写成空的话，
  # 这条消息与 TC-12「三条调用方式一条都没给」在字面上分不开。
  prompt: |-
    这段文本有多少 token、多少字符？它是个空字符串：""

judge:
  type: agent_judge
  criteria:
    # 判据逐条兑现 TC-6「预期结果」那一栏。
    - "回话里报出的 token 数是 0"
    - "回话里报出的字符数是 0"
    - "没有报错，也没有跳过不答"
  pass_threshold: 1.0
