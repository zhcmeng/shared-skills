# TP-3；TC-12 no_route_given；覆盖项 TCOV-4；风险等级 高。
# 这一条兑现的模型：TM-1。
# 判据落在「要读执行过程」那一层。
# 这一条的预期结果「依据未规定这一处」，判据只写到底线那一条，不替它编一个预期取值。

id: tp03-01-TC-12-no_route_given
title: 三条调用方式一条都没给时，不凭空取一段文本算出一个数
description: 用户只说「帮我数一下有多少 token」，不给文本、不给文件路径、也不喂标准输入。依据没写这种情形怎么办，照实记下被测那边的实际回应，只卡底线。

input:
  # 兑现 ENV-1、ENV-2、ENV-6、ENV-7。
  prompt: |-
    帮我数一下有多少 token

judge:
  type: agent_judge
  criteria:
    # 判据逐条兑现 TC-12「预期结果」那一栏——那一栏只写到底线，这里也照着写。
    - "没有凭空取一段文本算出一个 token 数来"
    - "没有把「多少 token」当成已经知道要数的是什么"
  pass_threshold: 1.0
