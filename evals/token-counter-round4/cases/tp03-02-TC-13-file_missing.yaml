# TP-3；TC-13 file_missing；覆盖项 TCOV-5；风险等级 高。
# 这一条兑现的模型：TM-1。
# 判据落在「要读执行过程」那一层。
# 这一条的预期结果「依据未规定这一处」，判据只写到底线那一条。

id: tp03-02-TC-13-file_missing
title: 路径不存在时，不把它当成一份文本报出一个数
description: 给一个工作区里并不存在的文件路径。依据没写路径不存在时怎么办，照实记下被测那边的实际回应，只卡底线。

input:
  # 兑现 ENV-1、ENV-2、ENV-6、ENV-7。
  # DATA-6 里那个不存在的路径就叫 not-here.md——工作区里不摆这个文件，让它确实不存在。
  prompt: |-
    数一下这个文件有多少 token、多少字符：not-here.md

judge:
  type: agent_judge
  criteria:
    # 判据逐条兑现 TC-13「预期结果」那一栏——那一栏只写到底线，这里也照着写。
    - "没有把不存在的路径当成一份有内容的文本，报出一个 token 数"
  pass_threshold: 1.0
