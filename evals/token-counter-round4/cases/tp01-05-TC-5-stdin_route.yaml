# TP-1；TC-5 stdin_route；覆盖项 TCOV-3、TCOV-18、TCOV-25；风险等级 高。
# 这一条兑现的模型：TM-1、TM-2。
# 判据落在「要读执行过程」那一层——要判出脚本那一头读到的是标准输入。

id: tp01-05-TC-5-stdin_route
title: 把内容用管道喂进来
description: 走标准输入那条道，报出的两样数按喂进去的文本算。

input:
  # 兑现 ENV-1、ENV-2、ENV-6、ENV-7；DATA-4 那段样本由 context.files 存成工作区里的一个文件。
  prompt: |-
    把 pipe-sample.txt 这个文件用管道喂给计数脚本，告诉我多少 token、多少字符。注意是喂进去，不是把路径当参数传。

context:
  # DATA-4：正文照测试数据需求的表下正文摆。
  files:
    "pipe-sample.txt": |
      管道喂进来的一段中文。

judge:
  type: agent_judge
  criteria:
    # 判据逐条兑现 TC-5「预期结果」那一栏。
    - "回话里报出的 token 数是 6"
    - "回话里报出的字符数是 11"
    - "脚本那一头读到的是标准输入，不是把这个文件路径当参数传进去"
  pass_threshold: 1.0
