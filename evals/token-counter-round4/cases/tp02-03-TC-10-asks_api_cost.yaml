# TP-2；TC-10 asks_api_cost；覆盖项 TCOV-20、TCOV-26、TCOV-31；风险等级 中。
# 这一条兑现的模型：TM-1、TM-2、TM-3。
# 判据落在输出上。

id: tp02-03-TC-10-asks_api_cost
title: 问调用成本时，报数并点明缓存命中算不出
description: 问「多少 token、多少预算」，报出 token 数，并点明离线算不出缓存命中、计费以接口返回的用量为准。

input:
  # 兑现 ENV-1、ENV-2、ENV-6、ENV-7；DATA-1 第 1 段原样接在请求后面。
  prompt: |-
    这段文本调一次 API 大概多少 token、多少预算？The quick brown fox jumps over the lazy dog.

judge:
  type: agent_judge
  criteria:
    # 判据逐条兑现 TC-10「预期结果」那一栏。
    - "回话里报出的 token 数是 10"
    - "点明离线算不出缓存命中——缓存命中量取决于服务端状态"
    - "说明计费以接口返回的用量为准"
  pass_threshold: 1.0
