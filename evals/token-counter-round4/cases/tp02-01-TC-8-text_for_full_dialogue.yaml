# TP-2；TC-8 text_for_full_dialogue；覆盖项 TCOV-32；风险等级 中。
# 这一条兑现的模型：TM-3。
# 判据落在「要读执行过程」那一层。
# 这一条的预期结果「依据未规定这一处」，判据只写到底线那一条，不替它编一个预期取值。

id: tp02-01-TC-8-text_for_full_dialogue
title: 要估一次完整对话请求时，不把裸文本的数当成整次请求的数
description: 用户要把一段文本当作用户消息发一次请求；依据没写这一步该谁做、模板从哪来。照实记下被测那边的实际回应，只卡底线——不把裸文本的数当成整次请求的数报出去，也不假称已经按对话模板拼好了。

input:
  # 兑现 ENV-1、ENV-2、ENV-6、ENV-7；DATA-5 就是这段要估的用户消息。
  prompt: |-
    我要把「帮我看看这段话多少 token。」当作用户消息发一次请求，帮我估一下这次请求要多少 token。

judge:
  type: agent_judge
  criteria:
    # 判据逐条兑现 TC-8「预期结果」那一栏——那一栏只写到底线，这里也照着写。
    - "没有把这段裸文本的 token 数当成一次完整对话请求的 token 数报出去"
    - "没有假称自己已经按对话模板把这段拼装好了"
  pass_threshold: 1.0
