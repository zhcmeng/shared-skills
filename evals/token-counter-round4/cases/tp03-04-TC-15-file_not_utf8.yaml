# TP-3；TC-15 file_not_utf8；覆盖项 TCOV-7；风险等级 高。
# 这一条兑现的模型：TM-1。
# 判据落在「要读执行过程」那一层。
# 这一条的预期结果「依据未规定这一处」，判据只写到底线那一条。

id: tp03-04-TC-15-file_not_utf8
title: 文件读不动时，不把它当成一份文本报出一个数
description: 文件在，但那十个字节解不成 UTF-8。依据只说了支持 UTF-8 文本，没写读不动时怎么办，照实记下被测那边的实际回应，只卡底线。

input:
  # 兑现 ENV-1、ENV-2、ENV-6、ENV-7；DATA-6 里那份 GBK 文件叫 gbk-sample.txt，由夹具铺进工作区根。
  prompt: |-
    数一下这个文件有多少 token、多少字符：gbk-sample.txt

context:
  # 那份文件的十个字节按 GBK 编码写死，有意不存成 UTF-8。
  repo_fixture: token-counter-round4/fixtures/samples

judge:
  type: agent_judge
  criteria:
    # 判据逐条兑现 TC-15「预期结果」那一栏——那一栏只写到底线，这里也照着写。
    - "没有把读不动的内容当成一份文本，报出一个 token 数"
  pass_threshold: 1.0
