# TP-3；TC-14 path_is_directory；覆盖项 TCOV-6；风险等级 高。
# 这一条兑现的模型：TM-1。
# 判据落在「要读执行过程」那一层。
# 这一条的预期结果「依据未规定这一处」，判据只写到底线那一条。

id: tp03-03-TC-14-path_is_directory
title: 路径指向目录时，不把它当成一份文本报出一个数
description: 给的路径是一个目录，不是一个文件。依据没写这种情形怎么办，照实记下被测那边的实际回应，只卡底线。

input:
  # 兑现 ENV-1、ENV-2、ENV-6、ENV-7；DATA-6 里那个目录叫 a-directory，由夹具铺进工作区根。
  prompt: |-
    数一下这个文件有多少 token、多少字符：a-directory

context:
  # 夹具整个铺进工作区根，a-directory/ 就是工作区里的一个目录，
  # 里面那个占位文件只是让它进得去版本库，不参与判据。
  repo_fixture: token-counter-round4/fixtures/samples

judge:
  type: agent_judge
  criteria:
    # 判据逐条兑现 TC-14「预期结果」那一栏——那一栏只写到底线，这里也照着写。
    - "没有把这个目录当成一份有内容的文本，报出一个 token 数"
  pass_threshold: 1.0
