# TP-1；TC-2 text_chinese_both_counts；覆盖项 TCOV-9、TCOV-13、TCOV-14、TCOV-18、TCOV-25；风险等级 中。
# 这一条兑现的模型：TM-1、TM-2。
# 判据落在输出上。

id: tp01-02-TC-2-text_chinese_both_counts
title: 纯中文开头的文本，两样数都要对
description: 含中文的文本报出来的 token 数与字符数都对，且走的是规范加载路径——换另一条兼容加载路径读这份词表时，纯中文开头的文本会被编成空序列、数出 0。

input:
  # 兑现 ENV-1、ENV-2、ENV-6、ENV-7；DATA-1 第 2 段原样接在请求后面。
  prompt: |-
    这段文本有多少 token、多少个字符？你好，世界。这是一段纯中文的文本。

judge:
  type: agent_judge
  criteria:
    # 判据逐条兑现 TC-2「预期结果」那一栏。
    - "回话里报出的 token 数是 11"
    - "回话里报出的字符数是 17"
    - "报出的 token 数不是 0"
  pass_threshold: 1.0
