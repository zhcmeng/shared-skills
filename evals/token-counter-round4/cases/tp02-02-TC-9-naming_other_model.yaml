# TP-2；TC-9 naming_other_model；覆盖项 TCOV-22、TCOV-23、TCOV-28、TCOV-30；风险等级 中。
# 这一条兑现的模型：TM-1、TM-2、TM-3。
# 判据落在输出上。

id: tp02-02-TC-9-naming_other_model
title: 点名别的模型时明确说不覆盖，一个近似数都不给
description: 用户点名 Claude，回话要说明本技能只覆盖 DeepSeek 官方词表，不给近似数、不给估算区间，也不拿别的数顶上。

input:
  # 兑现 ENV-1、ENV-2、ENV-6、ENV-7；DATA-1 第 1 段原样接在请求后面。
  prompt: |-
    用 Claude 的 tokenizer 算一下这段有多少 token：The quick brown fox jumps over the lazy dog.

judge:
  type: agent_judge
  criteria:
    # 判据逐条兑现 TC-9「预期结果」那一栏。
    - "明确说明这一套只覆盖 DeepSeek 的官方词表、算不了别的模型"
    - "没有给出近似数"
    - "没有给出估算区间"
    - "没有拿别的模型的数顶上来"
  pass_threshold: 1.0
