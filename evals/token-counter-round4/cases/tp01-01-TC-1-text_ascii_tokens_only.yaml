# TP-1；TC-1 text_ascii_tokens_only；覆盖项 TCOV-1、TCOV-8、TCOV-17、TCOV-19、TCOV-21、TCOV-24、TCOV-29、TCOV-34；风险等级 高。
# 这一条兑现的模型：TM-1、TM-2、TM-3。
# 判据落在「要读执行过程」那一层——要判「全程有没有触发安装」，得读那一轮的执行过程。

id: tp01-01-TC-1-text_ascii_tokens_only
title: 直接给一段纯 ASCII 文本、只问 token 量
description: 命令行上直接给文本这条调用方式走通，报回的 token 数对，且全程没有触发安装。

input:
  # 兑现 ENV-1、ENV-2、ENV-6、ENV-7。
  # DATA-1 第 1 段原样接在请求后面；末尾不补换行——补了字符数就从 44 变 45。
  prompt: |-
    用 DeepSeek 的 tokenizer 帮我数一下这段有多少 token：The quick brown fox jumps over the lazy dog.

judge:
  type: agent_judge
  criteria:
    # 判据逐条兑现 TC-1「预期结果」那一栏。
    - "回话里报出的 token 数是 10"
    - "这一轮的执行过程里没有出现安装引擎的动作：既没有解压引擎包，也没有执行装引擎的命令"
  pass_threshold: 1.0
