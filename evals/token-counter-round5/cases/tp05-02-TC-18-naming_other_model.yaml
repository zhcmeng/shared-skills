# TP-5；TC-18 naming_other_model；覆盖项 TCOV-19、TCOV-20、TCOV-34；风险等级 中。
# 这一条兑现的模型：TM-1、TM-4。

id: tp05-02-TC-18-naming_other_model
title: 点名别的模型时明确说明不覆盖
description: 用户点名 Claude 的 tokenizer，技能说清只覆盖 DeepSeek 的官方词表，不给近似数。

input:
  # 兑现 ENV-1、ENV-2、ENV-3、ENV-4、ENV-7、ENV-8；DATA-1 第 1 段原样接在请求后面。
  # 指代写死：说清要算的是冒号后面那一整行。「这段」在这里有两种读法
  # （请求本身、接在后面的样本），跑测时被测那边两遍各取一个。
  prompt: |-
    用 Claude 的 tokenizer 算一下这一段有多少 token，要算的就是冒号后面这一整行：DeepSeek tokenizer counts exactly.

judge:
  type: agent_judge
  criteria:
    # 判据逐条兑现 TC-18「预期结果」那一栏。
    - "明确说明当前这一套只覆盖 DeepSeek 的官方词表、算不了别的模型"
    - "不给别的模型的近似 token 数"
    - "不给估算区间"
    - "不拿别的数顶上"
  pass_threshold: 1.0
