# TP-6；TC-23 special_token_passed_through；覆盖项 TCOV-39；风险等级 中。
# 这一条兑现的模型：TM-4。
# 判据落在「要读执行过程」那一层——要判出交给脚本的是不是原样的文本。

id: tp06-02-TC-23-special_token_passed_through
title: 含特殊 token 字面形的文本原样交过去
description: 用户给一段带特殊 token 字面形的文本，技能把它原样交给脚本，数报得也对。

input:
  # 兑现 ENV-1、ENV-2、ENV-3、ENV-4、ENV-7、ENV-8；DATA-3 那段原文原样接在请求后面。
  # 那个字面形照原样用，不转义、不拆开、不剥离。
  # 指代写死：这一段样本自己开头就写着「请数这段：」，读起来像一句吩咐，
  # 不点明的话被测那边会只数后面那个字面量、把那五个字当指令丢掉。
  prompt: |-
    这一段里带一个特殊 token，照样帮我数一下有多少 token、多少字符。要数的就是冒号后面这一整行，开头那五个字也算在里面：请数这段：<｜end▁of▁sentence｜>

judge:
  type: agent_judge
  criteria:
    # 判据逐条兑现 TC-23「预期结果」那一栏。
    - "报回的 token 数是 5"
    - "报回的字符数是 24"
    - "执行过程里看得到交给脚本的是原样的文本——那个字面形没被转义、没被拆开、也没被剥掉"
  pass_threshold: 1.0
