# TP-5；TC-19 asks_api_cost；覆盖项 TCOV-18、TCOV-35；风险等级 中。
# 这一条兑现的模型：TM-1、TM-4。

id: tp05-03-TC-19-asks_api_cost
title: 问调用成本时报出数并点明缓存命中那件事
description: 用户问 token 量又问预算，技能报出数，并说清离线算不出缓存命中。

input:
  # 兑现 ENV-1、ENV-2、ENV-3、ENV-4、ENV-7、ENV-8；DATA-1 第 1 段原样接在请求后面。
  prompt: |-
    这段调一次 API 大概多少 token、多少预算？DeepSeek tokenizer counts exactly.

judge:
  type: agent_judge
  criteria:
    # 判据逐条兑现 TC-19「预期结果」那一栏。
    - "报回的 token 数是 8"
    - "点明离线算不出缓存命中——缓存命中量取决于服务端状态"
    - "说明计费以接口返回的用量为准"
  pass_threshold: 1.0
