# TP-5；TC-17 counting_request_main_scenario；覆盖项 TCOV-2、TCOV-33；风险等级 中。
# 这一条兑现的模型：TM-1、TM-4。
# 判据落在「要读执行过程」那一层——要判出技能真把计数脚本调起来跑了一遍。

id: tp05-01-TC-17-counting_request_main_scenario
title: 一次计数请求走完，报回的数拿的是脚本算出来的那一个
description: 用户指着一个文件问两样数，技能跑脚本、把脚本吐出的那两行报回去。

input:
  # 兑现 ENV-1、ENV-2、ENV-3、ENV-4、ENV-7、ENV-8；DATA-4 那份文件由 context.files 铺在工作区根下。
  prompt: |-
    数一下这个文件有多少 token、多少字符：sample.md

context:
  # DATA-4：正文照测试数据需求摆；字节按不带字节顺序标记的 UTF-8、末尾一个换行，整份 65 个字节。
  # 判据那两个数（13 个 token、25 个字符）就落在这份字节上，别多给一个换行、也别吃掉。
  files:
    "sample.md": |
      # 计数样本

      这一段用来核对文件那条调用方式。

judge:
  type: agent_judge
  criteria:
    # 判据逐条兑现 TC-17「预期结果」那一栏。
    - "报回的 token 数是 13"
    - "报回的字符数是 25"
    - "执行过程里看得到技能真把计数脚本调起来跑了一遍"
    - "报回的那两个数就是脚本那两行里的数，不是另找来的"
  pass_threshold: 1.0
