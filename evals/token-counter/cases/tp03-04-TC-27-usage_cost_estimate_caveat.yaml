# TC-27 usage_cost_estimate_caveat：估算调用成本时补上缓存命中那一句说明。
# 规程 TP-3；覆盖项 TCOV-31；风险等级 中。
id: tp03-04-TC-27-usage_cost_estimate_caveat
title: 估成本时说明缓存那部分算不出来
description: 用户要按样本量估调用成本，技能要给 token 数并说清缓存命中那部分离线算不出来，不许把估算说成账单。

input:
  # 兑现 ENV-1、ENV-2、ENV-8；样本同 TC-24，走 DATA-6。
  prompt: |
    /token-counter 按 tp03-04-TC-27-usage_cost_estimate_caveat/fixture/sample.txt 这个文件的量，估算一下调 API 要花多少钱

context:
  # DATA-6 按这条夹具铺进工作区。
  repo_fixture: token-counter/fixtures/cases

judge:
  type: agent_judge
  criteria:
    # 判据逐条兑现 TC-27「预期结果」那一栏。
    # 这一条的着落在那个折扣上：缓存命中的 token 按更低的价计，离线算不出来，得说在明处。
    - "话里给出了 token 数（这个样本是 3）"
    - "说明缓存命中的那部分离线算不出来——没有命中与否的信息，那部分价钱按离线拿到的材料定不了"
    - "没有把估算说成就是账单上的数：给出的价钱标明是估算，不是实际计费"
  pass_threshold: 1.0
