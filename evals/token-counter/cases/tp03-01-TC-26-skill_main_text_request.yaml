# 落到 cases/tp03-01-TC-26-skill_main_text_request.yaml（路径从评测材料根算起；下同）
# TP-3
# TC-26
# TM-4
# TCOV-11、TCOV-47
# DATA-15
# ENV-1、ENV-2、ENV-3、ENV-7
#
# 判据从测试用例规格说明的「预期结果」栏压出来；「说清」「说明」这类判意思不判措辞。
id: tp03-01-TC-26-skill_main_text_request
title: 一句数文本的请求走完整条链，答话里报出 token 数
description: 把 DATA-15 那条消息原样发进会话；技能被唤起后照正文把脚本跑起来，答话里报出 token 数 4

input:
  prompt: |
    数一下冒号后面这一整行的 token：你好 world 世界

judge:
  type: agent_judge
  model: anthropic/claude-sonnet-4-6
  criteria:
    # 覆盖 TCOV-47（主场景走完）；这一条同时兑现 TCOV-11（混排文本数得对）
    - "答话里报出 token 数 4——冒号后那一行「你好 world 世界」11 个字符、4 个 token。"
    # 覆盖 TCOV-47
    - "过程记录里能看到脚本被跑了起来，交进去的是那一行文本（「你好 world 世界」）。"
  pass_threshold: 1.0
