# TC-29 usage_full_chat_request：要算一整轮对话请求时说清拼装那一步。
# 规程 TP-3；覆盖项 TCOV-33；风险等级 中。
id: tp03-06-TC-29-usage_full_chat_request
title: 算整轮对话请求要说清拼装那一步
description: 用户贴出一轮对话的消息要算请求量，技能要说清光算正文不够，得先按对话模板拼装成请求再计数。

input:
  # 兑现 ENV-1、ENV-2、ENV-8。不取任何数据项——消息正文是本条用例自己现写的。
  prompt: |
    /token-counter 帮我算一整轮对话请求要多少 token，消息我贴在下面了：

    user: 你好
    assistant: 你好，有什么可以帮你的？

judge:
  type: agent_judge
  criteria:
    # 判据逐条兑现 TC-29「预期结果」那一栏。
    # 这一条的着落在「拼装」上：请求里除了消息正文，还有对话模板带出来的角色标记与分隔符。
    - "说明光算消息正文不够，得先按对话模板把这几条消息拼装成请求再计数"
    - "给出的计数办法里包含拼装这一步，而不只是把两段正文的字数或 token 数加起来"
    - "没有只把消息正文一数就交差"
  pass_threshold: 1.0
