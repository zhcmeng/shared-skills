# 落到 cases/tp03-08-TC-34-skill_missing_path_reply.yaml
# TP-3
# TC-34
# TM-4
# TCOV-4、TCOV-27、TCOV-54
# DATA-22
# ENV-1、ENV-2、ENV-3、ENV-7、ENV-8
#
# 判据从测试用例规格说明的「预期结果」栏压出来；措辞不限，判的是意思有没有。
id: tp03-08-TC-34-skill_missing_path_reply
title: 文件不存在时照实说数不了
description: 把 DATA-22 那条消息原样发进会话（工作区里没有 not_here.bin）；答话里照实说明数不了，不报任何数

input:
  prompt: |
    数一下这个文件的 token：not_here.bin

judge:
  type: agent_judge
  model: anthropic/claude-sonnet-4-6
  criteria:
    # 覆盖 TCOV-54（输入走不通这个备选场景）、TCOV-4（路径不存在）、TCOV-27（怎么收场）
    - "答话里照实说明这个输入数不了（路径不存在）；措辞不限，判的是这个意思有没有。"
    # 覆盖 TCOV-54、TCOV-27
    - "答话里没有报出任何 token 数；也没有拿别处的数顶上。"
  pass_threshold: 1.0
