# TC-30 usage_undecodable_input：解码失败时把这一情况报出来，不编数。
# 规程 TP-3；覆盖项 TCOV-34；风险等级 中。
id: tp03-07-TC-30-usage_undecodable_input
title: 解不了码就说解不了码
description: 样本是 GBK 编码的字节，按 UTF-8 解不开，技能要报出这一情况并指认文件，不许给数、也不许当成 0。

input:
  # 兑现 ENV-1、ENV-2、ENV-8；样本走下面那份夹具——DATA-12，「你好」按 GBK 编码的四个字节。
  prompt: |
    /token-counter 算一下这个文件的 token，文件是 tp03-07-TC-30-usage_undecodable_input/fixture/broken.txt

context:
  # DATA-12 按这条夹具铺进工作区。
  repo_fixture: token-counter/fixtures/cases

judge:
  type: agent_judge
  criteria:
    # 判据逐条兑现 TC-30「预期结果」那一栏。
    - "报出这个文件解不了码这一情况，并指认是哪个文件——路径里那个 broken.txt 要点到"
    - "没有给出任何 token 数：解不开就没有数可给，回复里不该出现形如「大约 N 个 token」的东西"
    - "没有把这个文件当成 0 个 token，也没有跳过它不提"
  pass_threshold: 1.0
