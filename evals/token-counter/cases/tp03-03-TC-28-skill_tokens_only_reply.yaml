id: tp03-03-TC-28-skill_tokens_only_reply
title: 用户只要 token 量时，答话里报出 token 数
description: 把 DATA-17 那条消息原样发进会话；答话里报出那份文件的 token 数 3

context:
  repo_fixture: token-counter/fixtures/samples

input:
  prompt: |
    这个文件有多少个 token：chinese_file

judge:
  type: agent_judge
  model: anthropic/claude-sonnet-4-6
  criteria:
    # 覆盖 TCOV-52（只要 token 量这个备选场景）；这一条同时兑现 TCOV-22（答话里报出 token 数）
    - "答话里报出 token 数 3。"
  pass_threshold: 1.0
