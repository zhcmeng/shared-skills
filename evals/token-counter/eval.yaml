schema_version: v1alpha1

# 这一份落的是 TM-4（场景测试的模型）——九条备选场景加一条主场景，一条用例一个场景。
# 其余三个模型不在这里：TM-1（等价类划分）、TM-2（边界值分析）、TM-3（判定表测试）
# 那三门的判据落在命令、退出码与盘上的文件上，归批一，落在 tests/token-counter/ 的测试代码里。

# ENV-1、ENV-2、ENV-3、ENV-4、ENV-8：测试规程、被测那侧、CPython 解释器、已装好的引擎、
# 能起子进程并读回结果的执行环境——五样指的是同一台机器，都由这一条兑现：命令在宿主机上跑，不起容器。
environment:
  type: none
  # ENV-5：只有 tc-32（tp03-09）用得上——会话起来之前现建一个干净环境，里面不装引擎。
  # 这一步是整份配置级的，九条用例每条开跑前都会走一遍；对另外八条没有影响，只是白建一次。
  # 路径写死成绝对路径：建它的时候工作区还是个空目录，相对路径没有可作基准的东西，
  # tp03-09 那条的消息里把这个路径原样给被测那边。
  # --clear 是为了重跑：上一回跑完引擎已经装在里面了，不清掉的话那条用例就白跑了。
  setup_steps:
    - run: python -m venv --clear "C:/Study/shared-skills/evals/token-counter/.clean-venv"

# ENV-7：技能装进工作区的 .claude/skills/token-counter/，随包分发的 tokenizer.json 与 wheels/
# 跟着一起进去。相对路径的基准是 eval.yaml 的上一层（evals/）——技能与评测材料不在一棵树里，
# 跑起来会打一条 SKILL.md not found ... falling back to 的警告，那是正常产物，不是错。
skills:
  - source: local_path
    path: ../plugin/skills/token-counter

engine:
  name: claude_code

cases:
  # 落成约定：文件名照 issue_ids.py --case-dirs 打出来的写，加 .yaml。
  files:
    - token-counter/cases/tp03-01-TC-24-usage_count_file_tokens.yaml
    - token-counter/cases/tp03-02-TC-25-usage_report_tokens_only.yaml
    - token-counter/cases/tp03-03-TC-26-usage_other_model_declined.yaml
    - token-counter/cases/tp03-04-TC-27-usage_cost_estimate_caveat.yaml
    - token-counter/cases/tp03-05-TC-28-usage_special_token_counted.yaml
    - token-counter/cases/tp03-06-TC-29-usage_full_chat_request.yaml
    - token-counter/cases/tp03-07-TC-30-usage_undecodable_input.yaml
    - token-counter/cases/tp03-08-TC-31-usage_multiple_files_total.yaml
    - token-counter/cases/tp03-09-TC-32-usage_first_run_no_extra_step.yaml
  # 串着跑。TC-32 那条要在「引擎还没装」的状态下开跑，两条同时跑会互相扰。
  parallelism: 1
  defaults:
    # 机械层只卡这一条，其余判据交给判官——判的是回复里说了什么，卡不住。
    expect:
      exit_code: 0

judge:
  type: agent_judge
  # 判官自己也要跑一轮模型。走的是本机那个网关，模型名用 Anthropic 那一套。
  model: anthropic/claude-sonnet-5
  # context 用默认的 standard：final_message 内联，transcript 与 workspace_diff 以文件引用给出。
  # TC-24、TC-25、TC-28、TC-31 要判「有没有真去跑脚本、跑出来的数是几」，得读 transcript 才判得了。

report:
  # result.json 一直会写，那一项不用列。把 html 列上，跑完直接出一份能点开看的报告——
  # 已经跑过的那几轮没赶上这一条，用 report 子命令从 result.json 补出来的。
  formats: [json, html]
