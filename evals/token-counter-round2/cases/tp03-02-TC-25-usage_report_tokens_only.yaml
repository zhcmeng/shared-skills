# TC-25 usage_report_tokens_only：用户只问 token 量，技能把 token 数报出来。
# 规程 TP-3；覆盖项 TCOV-29；风险等级 中。
id: tp03-02-TC-25-usage_report_tokens_only
title: 只问 token 量就把 token 数报出来
description: 用户只问 token 数，回话里要给出这个数；走的是把文本直接交给脚本那条来路。

input:
  # 兑现 ENV-1、ENV-3、ENV-7、ENV-8（都在批次配置的 environment 与 engine 那两条上）。
  # 这一段就是通用稿「输入」栏里用户说的那句话，一个字不改。
  # DATA-2 的正文「你好，世界」直接写在消息里——技能自己的 SKILL.md 里那一句示例
  # 用的就是它，用户照着示例问也是常事。
  prompt: |
    算一下 "你好，世界" 有几个 token

judge:
  type: agent_judge
  criteria:
    # 判据逐条兑现 TC-25「预期结果」那一栏。
    # 这一条不判「有没有顺带报字符数」：依据写的是「报告 N 即可」，那是允许，
    # 没说不许附带别的——照「只报 N」判下去就是一例假失败。
    - "回复里给出了 token 数，是 3"
    - "走的是把这段文本直接交给脚本那条来路：transcript 里那条命令带 `--text`（或从标准输入喂进去），不是先把它写成文件再算"
    - "transcript 里能看到那个数真是跑脚本跑出来的"
  pass_threshold: 1.0
