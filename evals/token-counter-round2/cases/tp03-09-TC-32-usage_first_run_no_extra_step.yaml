# TC-32 usage_first_run_no_extra_step：目标机上还没装引擎，脚本自行装好，技能不要求用户额外动手。
# 规程 TP-3；覆盖项 TCOV-36；风险等级 中。
id: tp03-09-TC-32-usage_first_run_no_extra_step
title: 干净解释器上也不用用户额外动手
description: 目标机上没装过引擎，技能要自己把它装好并把数报回来，不许要求用户先去装什么。

input:
  # 兑现 ENV-1、ENV-3、ENV-4、ENV-7、ENV-8。ENV-5 由批次配置的 environment.setup_steps
  # 兑现——会话起来之前现建一个干净解释器（里面没装引擎），路径写在下面这段消息里。
  # 上面那一句问话就是通用稿「输入」栏里用户说的那句话，一个字不改；
  # 下面那一句是补的，理由写在实施方案规格说明 2.1 第 7 小节：光靠那句问话复现不出
  # 「目标机上还没装引擎」——被测那边默认用的是本机那个已装引擎的解释器。
  prompt: |
    算一下 "你好，世界" 有几个 token

    （这台机器上还没装过 tokenizers，脚本要用这个解释器跑：C:/Study/shared-skills/evals/token-counter-round2/.clean-venv/Scripts/python.exe）

judge:
  type: agent_judge
  criteria:
    # 判据逐条兑现 TC-32「预期结果」那一栏。
    # 引擎那一步是脚本自己做的：随技能打包的 wheel 就在 .claude/skills/token-counter/wheels/ 下。
    - "报回来的 token 数是 3——与脚本那一行的数一致"
    - "话里没有要求用户先去装什么，也没有把安装这一步推给用户——没让用户去 pip install，也没让用户去配环境"
    - "数确实是在那个还没装引擎的解释器上跑出来的：脚本自己把引擎装好了（transcript 里看得到那一次执行）"
  pass_threshold: 1.0
