# TC-27 usage_cost_estimate_caveat：用户要估算调用成本，技能补一句缓存命中离线算不出来。
# 规程 TP-3；覆盖项 TCOV-31；风险等级 中。
id: tp03-04-TC-27-usage_cost_estimate_caveat
title: 估成本要补一句缓存命中算不出来
description: 用户要拿 token 数估 API 成本，技能要给数并说明缓存命中那部分离线算不出来，不把估算说成账单。

input:
  # 兑现 ENV-1、ENV-3、ENV-7、ENV-8（都在批次配置的 environment 与 engine 那两条上）。
  # 这一段就是通用稿「输入」栏里用户说的那句话，一个字不改。
  prompt: |
    按「你好，世界」这段文本，估一下调 API 大概要多少钱？

judge:
  type: agent_judge
  criteria:
    # 判据逐条兑现 TC-27「预期结果」那一栏。
    # 缓存命中那一句是技能自己的 SKILL.md 里单列的一条，最容易漏。
    - "回话里给出了 token 数，是 3，并且是跑脚本跑出来的"
    - "说明了缓存命中（prompt_cache_hit_tokens）那部分取决于服务端状态、离线算不出来"
    - "没有把这个估算说成就是账单上的数——说明计费以线上返回的 usage 为准"
  pass_threshold: 1.0
