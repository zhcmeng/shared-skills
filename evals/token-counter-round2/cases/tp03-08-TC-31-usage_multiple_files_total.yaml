# TC-31 usage_multiple_files_total：一次给多个文件，技能逐个报出并给合计。
# 规程 TP-3；覆盖项 TCOV-35；风险等级 中。
id: tp03-08-TC-31-usage_multiple_files_total
title: 多个文件逐个报出并给合计
description: 一次给两个文件，技能要分别报出各自的数再给合计，不许只报其中一个。

input:
  # 兑现 ENV-1、ENV-3、ENV-7、ENV-8（都在批次配置的 environment 与 engine 那两条上）。
  # 这一段就是通用稿「输入」栏里用户说的那句话，一个字不改。
  prompt: |
    ./a.txt 和 ./b.txt 加起来一共多少 token？

context:
  # DATA-13 按这条夹具铺进工作区，两个样本落在工作区根上的 ./a.txt 与 ./b.txt。
  # a.txt 正文与 DATA-2 相同（15 字节的中文），b.txt 是 0 字节的空文件。
  repo_fixture: token-counter-round2/fixtures/cases/tp03-08-TC-31-usage_multiple_files_total

judge:
  type: agent_judge
  criteria:
    # 判据逐条兑现 TC-31「预期结果」那一栏。
    # 第二个是零字节文件，它的数是 0——最容易出的岔子是把它当成没给、或者干脆略过。
    - "两个文件各自的数都报了出来：a.txt 是 3，b.txt 是 0"
    - "给出了合计 3"
    - "没有只报其中某一个文件就把合计端出来"
  pass_threshold: 1.0
