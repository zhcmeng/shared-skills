# TC-30 usage_undecodable_input：输入没法按 UTF-8 解码，技能把这一情况报出来。
# 规程 TP-3；覆盖项 TCOV-34；风险等级 中。
id: tp03-07-TC-30-usage_undecodable_input
title: 解不了码就把这一情况报出来
description: 文件含非 UTF-8 字节，技能要报出解不了码、指认是哪个文件，也不当成 0。

input:
  # 兑现 ENV-1、ENV-3、ENV-7、ENV-8（都在批次配置的 environment 与 engine 那两条上）。
  # 这一段就是通用稿「输入」栏里用户说的那句话，一个字不改。
  prompt: |
    算一下 ./broken.txt 的 token 数

context:
  # DATA-12 按这条夹具铺进工作区，落在 ./broken.txt。
  # 头两个字节是 0xFF 0xFE，后面跟一段正常的 UTF-8 正文——这一份必须按字节铺，
  # 不能按文本写：写成文本就变成合法的 UTF-8 了，这一条要的就是解不了码。
  repo_fixture: token-counter-round2/fixtures/cases/tp03-07-TC-30-usage_undecodable_input

judge:
  type: agent_judge
  criteria:
    # 判据逐条兑现 TC-30「预期结果」那一栏。
    # 这一条不判「有没有给出数」：依据没写解码不了时该怎么答，那是未规定功能
    # （脚本那一层只说非 UTF-8 会报错退出），照着判等于把设计者的取法当依据。
    - "回话里报出这个文件解不了码（不是合法的 UTF-8，或等义的说法）"
    - "指认了是哪个文件——回话里点出 broken.txt（或那个文件的路径）"
    - "没有把这个文件当成 0，也没有跳过不提"
  pass_threshold: 1.0
