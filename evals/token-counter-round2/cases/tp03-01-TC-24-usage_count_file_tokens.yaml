# 批二（TP-3）九条用例的头一条。这一批落的是 TM-4——场景测试的模型：一条主场景加八条
# 备选场景，一条用例一个场景。批次层面的那些（技能装哪一份、TC-32 那个干净解释器怎么建、
# 判官用哪个模型）写在同目录上一级的批次配置里，九条共用那一份。
# 其余三个模型不在这里：TM-1、TM-2、TM-3 的判据落在命令、退出码与盘上的文件上，归批一，
# 这一轮还没落成。
#
# TC-24 usage_count_file_tokens：主场景——用户要算一个文件的 token 量，技能跑出数并报回来。
# 规程 TP-3；覆盖项 TCOV-28；风险等级 中。
id: tp03-01-TC-24-usage_count_file_tokens
title: 算一个文件的 token 量
description: 用户给一个 UTF-8 样本文件的路径，技能要跑出数并报回来，不许凭空给数。

input:
  # 兑现 ENV-1、ENV-3、ENV-7、ENV-8（都在批次配置的 environment 与 engine 那两条上）。
  # 这一段就是通用稿「输入」栏里用户说的那句话，一个字不改——连技能名都不点，
  # 看它自己认不认得出来该走这个技能。
  prompt: |
    帮我算一下 ./sample.txt 里有多少 token

context:
  # DATA-6 按这条夹具铺进工作区。铺的是这个夹具目录的内容，
  # 所以样本落在工作区根上的 ./sample.txt，与上面那句话里的路径对得上。
  # 15 字节的中文「你好，世界」，不带字节顺序标记。
  repo_fixture: token-counter-round2/fixtures/cases/tp03-01-TC-24-usage_count_file_tokens

judge:
  type: agent_judge
  criteria:
    # 判据逐条兑现 TC-24「预期结果」那一栏，措辞不限。
    # 技能落在工作区的 .claude/skills/token-counter/，判路径按这一串，不照通用稿里那串。
    - "回复里报出的 token 数是 3——与 .claude/skills/token-counter/scripts/count_tokens.py 对这个样本吐出来的那一行一致"
    - "transcript 里能看到它真的把那个脚本跑起来了（执行过 count_tokens.py 或等价的命令），不是照着印象说的"
    - "这个数是跑出来的，不是凭空给的：transcript 里找得到对应的那次执行"
  pass_threshold: 1.0
