schema_version: v1alpha1

# 这一份落的是 TM-4（场景测试的模型）——一条主场景加八条备选场景，一条用例一个场景。
# 其余三个模型不在这里：TM-1（等价类划分）、TM-2（边界值分析）、TM-3（判定表测试）
# 那三门的判据落在命令、退出码与盘上的文件上，归批一，这一轮还没落成。
#
# TP-3：三条规程里只有这一条落成评测用例；TP-1 与 TP-2 归批一。
# 九条用例按规程内位次排：用例目录名里 tp03-01 至 tp03-09 那一段就是执行顺序，
# 字母序等于执行顺序，不必另外排。

# ENV-1、ENV-3、ENV-7、ENV-8：测试规程、CPython 解释器、被测那侧的执行环境、
# 能起子进程并读回结果的执行环境——四样指的是同一台机器，都由这一条兑现：
# 命令在宿主机上跑，不起容器。
environment:
  type: none
  # ENV-5：只有 tp03-09（TC-32）用得上——会话起来之前现建一个干净解释器，里面不装引擎。
  # 这一步是整份配置级的，九条用例每条开跑前都走一遍；对另外八条没有用，只是白建一次。
  # 要它只落在 TC-32 那条身上做不到，只能拆成两份配置分两次跑。
  # 路径写死成绝对路径：建它的时候工作区还是个空目录，相对路径没有可作基准的东西，
  # tp03-09 那条的消息里把这个路径原样给被测那边。
  # --clear 是为了重跑：上一回跑完引擎已经装在里面了，不清掉的话那条用例就白跑了。
  setup_steps:
    - run: python -m venv --clear "C:/Study/shared-skills/evals/token-counter-round2/.clean-venv"

# ENV-4：技能装进工作区的 .claude/skills/token-counter/，随包分发的 tokenizer.json 与
# wheels/ 跟着一起进去。相对路径的基准是这一份配置的上一层（evals/）——技能与评测材料
# 不在一棵树里，跑起来会打一条 SKILL.md not found ... falling back to 的警告，
# 那是正常产物，不是错。
skills:
  - source: local_path
    path: ../plugin/skills/token-counter

engine:
  name: claude_code

cases:
  # 落成约定：文件名照 issue_ids.py --case-dirs 打出来的写，加 .yaml。
  files:
    - token-counter-round2/cases/tp03-01-TC-24-usage_count_file_tokens.yaml
    - token-counter-round2/cases/tp03-02-TC-25-usage_report_tokens_only.yaml
    - token-counter-round2/cases/tp03-03-TC-26-usage_other_model_declined.yaml
    - token-counter-round2/cases/tp03-04-TC-27-usage_cost_estimate_caveat.yaml
    - token-counter-round2/cases/tp03-05-TC-28-usage_special_token_counted.yaml
    - token-counter-round2/cases/tp03-06-TC-29-usage_full_chat_request.yaml
    - token-counter-round2/cases/tp03-07-TC-30-usage_undecodable_input.yaml
    - token-counter-round2/cases/tp03-08-TC-31-usage_multiple_files_total.yaml
    - token-counter-round2/cases/tp03-09-TC-32-usage_first_run_no_extra_step.yaml
  # 串着跑。TC-32 那条要在「那个解释器里还没装引擎」的状态下开跑，
  # 并发会让别的用例先跑到同一个解释器上去，把引擎装进去，那一条就白跑了。
  parallelism: 1
  defaults:
    # 机械层只卡这一条，其余判据交给判官——判的是回话里说了什么，卡不住。
    expect:
      exit_code: 0

judge:
  type: agent_judge
  # 判官自己也要跑一轮模型。走的是本机那个网关，模型名用 Anthropic 那一套。
  model: anthropic/claude-sonnet-5
  # context 用默认的 standard：final_message 内联，transcript 与 workspace_diff 以文件引用给出。
  # TC-24、TC-25、TC-28、TC-31、TC-32 要判「有没有真去跑脚本、跑出来的数是几」，
  # 得读 transcript 才判得了。

report:
  # result.json 一直会写，那一项不用列。把 html 列上，跑完直接出一份能点开看的报告。
  formats: [json, html]
