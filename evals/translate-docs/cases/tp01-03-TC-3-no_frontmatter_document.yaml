# 落到 evals/translate-docs/cases/tp01-03-TC-3-no_frontmatter_document.yaml
# TP-1 / TC-3
# TM：TM-1
# TCOV：TCOV-22、TCOV-26、TCOV-27
# DATA：DATA-3（样本，按它备一份副本）
# ENV：ENV-1、ENV-2、ENV-3、ENV-4、ENV-5
#
# 判据从测试用例规格说明的「预期结果」栏压出来，① 至 ⑤ 一条对一条；
# ⑤ 那一处依据没规定，照实施方案 1.2 第 6 小节写「记实际行为、不判对错」。
id: tp01-03-TC-3-no_frontmatter_document
title: 原文没有 frontmatter：说明句该插在哪依据没有规定，记实际行为
description: 把一份没有 frontmatter 的英文文档交给技能翻译；正文译成中文、硬换行不保留，说明句插在哪一处把实际行为记下来

input:
  prompt: |
    翻译这个文件：release-notes.md

context:
  repo_fixture: translate-docs/fixtures/repos/subject
  git:
    init: true

constraints:
  timeout_seconds: 1800
  max_turns: 12

expect:
  exit_code: 0
  files_exist:
    - "release-notes-中文版.md"

judge:
  type: agent_judge
  model: anthropic/claude-sonnet-4-6
  criteria:
    # 覆盖 TCOV-25
    - "① 工作区根多出一份 release-notes-中文版.md；除它以外，盘上其他文件跑完与跑前逐字节相同（含那份英文原文本身）。框架自己往 .claude/skills/ 里装技能、写基线这些动作不是被测那侧干的，不要算到「其他文件被动过」头上。"
    # 覆盖 TCOV-1、TCOV-2
    - "② 标题与段落文字译成了中文。"
    # 覆盖 TCOV-28
    - "③ 原文段落里的硬换行在中文版里不再保留（中文段内不换行）。"
    # 覆盖 TCOV-26
    - "④ 与原文逐项对应：标题层级、段落数与原文一致，没有增删内容。"
    # 覆盖 TCOV-22、TCOV-27；依据没规定，记实际行为
    - "⑤ 原文没有 frontmatter，说明句该插在哪里依据没有规定：把实际怎么处理的记一句（说明句插在文件头、插在标题之后、还是没插进去），报给用户定口径即可——这一处不判对错，不构成不通过的理由；说明句插进去了的，它的文字是不是照规定格式（含原文文件名 release-notes.md）一并记一句。"
  pass_threshold: 1.0
