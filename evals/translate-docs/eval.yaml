# 运行一：装技能，跑 TP-1 与 TP-2 的十条用例（TC-1 至 TC-10）。
# 相对路径的基准是 evals/：skill-up 从本配置所在目录往上找带 SKILL.md 的目录（最多 10 层），
# 找不到就退到「配置所在目录的上一层」。这份配置就在 evals/translate-docs/ 下，
# 所以基准是 evals/，下面每条相对路径都带 translate-docs/ 这个前缀。
# 依据：实施方案规格说明的 1.1（编号落到哪）与 1.2、1.3。
#
# 模型（TM）：这一批十条用例由三个模型导出——TM-1（文档元素与处理方式）、TM-2（目标形态与产出）、
# TM-3（使用场景）。哪个模型导出哪些覆盖项，见测试用例规格说明的「测试覆盖项」表；
# 三条各对应哪几条见各份用例配置文件头那一列编号。
#
# 环境项（ENV）落在哪儿：
#   ENV-1、ENV-2：下面 environment.type: none——规程与那侧都在跑测的这台机器上。
#   ENV-3：下面 report 那一段，加上各条用例的判官上下文（不写就是默认档）与 context.git.init: true。
#   ENV-4：框架为每条用例各新建一个空工作区，样本按 context.repo_fixture 铺进去，跑完就删。
#   ENV-5：下面 skills 第一项。
#   ENV-6：下面 skills 第二项——TC-8 的目标就是它（技能名在用例配置里写死）。
#
# 编号在盘上怎么留痕：每份用例配置的文件头与判据上方都带编号（照落成约定，一条一个号、
# 不写范围、数字不补零）；这一份不新编任何号。
schema_version: v1alpha1

environment:
  type: none

mcp:
  servers: []

skills:
  # ENV-5：被测的那门技能，整套按使用者机器上装好的样子进工作区（.claude/skills/translate-docs/）。
  - source: local_path
    path: ../plugin/skills/translate-docs
    include:
      - SKILL.md
  # ENV-6：TC-8 要按名字定位的那个技能。技能名照 ENV-6 的说法「照跑测机器上实际装着的取」——
  # 这台机器上装着的技能都是中文的（拿中文文档当翻译目标判不出东西），所以落成时改成由夹具里
  # 这份英文 SKILL.md 装成一个技能（.claude/skills/changelog-polish/），名字写死在 TC-8 那条里。
  # skills 只能配在批次这一层，所以十条用例都装上它；只有 TC-8 用它，其余九条的判据都不碰它。
  # 见实施方案 1.2 第 3 小节与第 8 小节。
  - source: local_path
    path: translate-docs/fixtures/skills/changelog-polish
    include:
      - SKILL.md

engine:
  name: claude_code

cases:
  files:
    - translate-docs/cases/tp01-01-TC-1-single_file_all_elements.yaml
    - translate-docs/cases/tp01-02-TC-2-code_and_diagrams_intact.yaml
    - translate-docs/cases/tp01-03-TC-3-no_frontmatter_document.yaml
    - translate-docs/cases/tp02-01-TC-4-directory_skips_translated.yaml
    - translate-docs/cases/tp02-02-TC-5-directory_all_translated.yaml
    - translate-docs/cases/tp02-03-TC-6-no_target_reports_error.yaml
    - translate-docs/cases/tp02-04-TC-7-missing_path_reports_error.yaml
    - translate-docs/cases/tp02-05-TC-8-skill_name_located.yaml
    - translate-docs/cases/tp02-06-TC-9-force_retranslate.yaml
    - translate-docs/cases/tp02-07-TC-10-single_file_existing_unspecified.yaml
  defaults:
    timeout_seconds: 1800
    max_turns: 12
    # 先筛：会话本身跑挂了就不花判官那份钱
    expect:
      exit_code: 0
  # 十条用例互不相扰（各起独立工作区、各铺一份夹具副本），取 4 是这台机器扛得住的档；
  # 要提速在命令行上加 --parallelism，不必改这里。见实施方案 1.2 第 4 小节。
  parallelism: 4
  retry_policy:
    max_retries: 0

benchmark:
  enabled: false

report:
  formats: [json, html]
  artifacts: [transcript]
